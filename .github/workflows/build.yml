name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Preparar proyecto
        run: |
          unzip -q profoot_local_ai.zip
          flutter create --platforms=android --project-name profoot_local_ai app
          rm -rf app/lib app/test app/pubspec.yaml
          cp -r profoot_local_ai/lib app/lib
          cp profoot_local_ai/pubspec.yaml app/pubspec.yaml
          cp profoot_local_ai/android/app/src/main/AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
          sed -i 's/flutter.minSdkVersion/24/' app/android/app/build.gradle*
      - name: Compilar
        run: cd app && flutter pub get && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: profoot-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
